name: Spike - untouched video test

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: spike-different-video-test
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Write cookies
        run: printf '%s' "$YOUTUBE_COOKIES" > /tmp/cookies.txt
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Try a video never touched today (not the Learn Dagbani channel)
        run: |
          yt-dlp -v --cookies /tmp/cookies.txt --remote-components ejs:github \
            -f "bv*+ba/b" --simulate --no-warnings \
            "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>&1 | grep -i "playability\|ERROR:\|format"
